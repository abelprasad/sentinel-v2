# SENTINEL v2 — CI: build + test on every push and PR.
# Failing tests stop the pipeline; nothing reaches Docker Hub or indra
# unless this workflow is green.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Full suite: unit tests + Testcontainers integration tests (Postgres 16).
      # GitHub runners have a Docker daemon, unlike indra's image builds.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    name: frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # --watch=false: single run, no interactive watcher in CI.
      - name: Unit tests
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Production build
        working-directory: frontend
        run: npm run build
