# SENTINEL v2 — single compose file for all environments.
# DNS override is codified here (Docker embedded DNS is broken on indra).
# Credentials come from .env only — never hardcoded.

services:
  db:
    image: postgres:16-alpine
    container_name: sentinel-db
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: 
    volumes:
      - sentinel-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sentinel]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: abelprasad/sentinel-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - 8888:8080
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sentinel
      SPRING_DATASOURCE_USERNAME: sentinel
      SPRING_DATASOURCE_PASSWORD: 
      JWT_SECRET: 
      LLM_API_KEY: 
      ADSB_URL: https://api.adsb.lol/v2/lat/40.0/lon/-75.1/dist/25
      CORS_ALLOWED_ORIGIN: 
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:8080/actuator/health]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: abelprasad/sentinel-ui:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - 3000:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:8080/]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sentinel-data:
