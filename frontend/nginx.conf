# SENTINEL v2 frontend — nginx serving the Angular SPA.
# /api is proxied to the backend (relative API base = zero hardcoded IPs).
# Runs on 8080 so nginx can drop root privileges.

upstream backend {
    server backend:8080;
}

server {
    listen 8080;
    server_name _;

    # Frontend static assets
    root /usr/share/nginx/html;
    index index.html;

    # Gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # API proxy — strips nothing, backend serves /api/*
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Actuator health passthrough (for compose health-gating if needed)
    location /actuator/ {
        proxy_pass http://backend;
    }

    # Angular SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Angular hashes filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
